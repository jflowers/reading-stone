# This workflow runs lint, type checking, and tests with coverage on
# every push and pull request to main.
name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # Learnings-only and toolkit-rollout PRs skip the test matrix; pushes and
  # every other PR run it. See jflowers/ship's README, "pr-scope.yml".
  scope:
    uses: jflowers/ship/.github/workflows/pr-scope.yml@3b0ce8bf47183be402df9eaec16644c213eee5f7 # main, after v0.11.0
    permissions:
      contents: read

  test:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        node-version: ["22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
      - run: npm ci
      - run: npx biome check src/ tests/
      - run: npm run build
      - run: npx vitest run --coverage

  # The one required check: a skipped matrix reports no per-leg checks, so
  # this always runs and fails unless scope succeeded and the test matrix
  # passed (code PRs) or was skipped (chore PRs).
  ci-ok:
    name: CI OK
    needs: [scope, test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - env:
          SCOPE: ${{ needs.scope.result }}
          CODE: ${{ needs.scope.outputs.code }}
          TEST: ${{ needs.test.result }}
        run: |
          [ "$SCOPE" = success ] || { echo "::error::scope: $SCOPE"; exit 1; }
          case "$CODE" in
            true) [ "$TEST" = success ] || { echo "::error::test: $TEST"; exit 1; } ;;
            false) [ "$TEST" = skipped ] || { echo "::error::test: $TEST"; exit 1; } ;;
            *) echo "::error::scope code '$CODE'"; exit 1 ;;
          esac
