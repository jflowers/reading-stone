# Release
# =======
# One-click release, run by a maintainer from main with the version tag
# (e.g. v0.3.0), following unbound-force/unbound-force's release.yml:
#
#   1. verify    — the run is on main and the tag matches package.json.
#   2. preflight — complytime/org-infra's shared preflight validates the
#                  tag (semver, unique, newer than the last tag), checks
#                  that ci.yml passed on HEAD and that there are
#                  unreleased commits, then creates the annotated tag.
#                  The `version tags` ruleset blocks people from creating
#                  v* tags; only this workflow (GitHub Actions bypass)
#                  can.
#   3. stage     — in the `npm` environment (required reviewers), builds
#                  the tagged commit, reruns the CI gates, and runs
#                  `npm stage publish` through npm trusted publishing
#                  (OIDC; no tokens). The version goes public when a
#                  maintainer approves it on npmjs.com with 2FA.
#
# The npm trust relationship pins this file's name (release.yml) and
# the `npm` environment, so neither can change without re-creating it.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag matching package.json (e.g., v0.3.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run the release from main (this run is on $REF)"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check the tag matches package.json
        env:
          TAG: ${{ inputs.tag }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

  preflight:
    name: Preflight
    needs: verify
    uses: complytime/org-infra/.github/workflows/reusable_release_preflight.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0
    with:
      tag: ${{ inputs.tag }}
      allow_prerelease: true
      # Job names from ci.yml's node-version matrix.
      ci_checks: '["test (22)", "test (24)"]'
    permissions:
      contents: write
      checks: read

  stage:
    name: Stage npm release
    needs: preflight
    if: needs.preflight.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm with staged publishing support
        run: npm install -g npm@11.21.2
      - run: npm ci
      - run: npx biome check src/ tests/
      - run: npm run build
      - run: npx vitest run --coverage
      - name: Stage for maintainer approval
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            *-*) npm stage publish --provenance --tag next ;;
            *) npm stage publish --provenance ;;
          esac
