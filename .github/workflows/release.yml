# This workflow stages a reading-stone release on npm when a v* tag is
# pushed. It authenticates through npm trusted publishing (OIDC; no
# tokens) and only ever runs `npm stage publish`: the staged version
# goes public when a maintainer approves it on npmjs.com with 2FA. The
# npm trust relationship pins this file's name (release.yml) and the
# `npm` environment, so neither can change without re-creating it.
name: release

on:
  push:
    tags: ["v*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions: {}

jobs:
  stage:
    name: Stage npm release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm with staged publishing support
        run: npm install -g npm@11.21.2
      - name: Check the tag matches package.json
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(node -p 'require("./package.json").version')"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi
      - run: npm ci
      - run: npx biome check src/ tests/
      - run: npm run build
      - run: npx vitest run --coverage
      - name: Stage for maintainer approval
        run: |
          version="$(node -p 'require("./package.json").version')"
          case "$version" in
            *-*) npm stage publish --provenance --tag next ;;
            *) npm stage publish --provenance ;;
          esac
