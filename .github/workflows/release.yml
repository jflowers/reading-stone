# Release
# =======
# One-click release, run by a maintainer from main with the version tag
# (e.g. v0.3.0). The pipeline is jflowers/ship's shared npm-release.yml,
# the same one the other npm packages use:
#
#   1. settings  — the run is on main, before anything is tagged.
#   2. preflight — complytime/org-infra's shared preflight validates the
#                  tag (semver, unique, newer than the last tag), checks
#                  that ci.yml passed on HEAD and that there are
#                  unreleased commits, then creates the annotated tag.
#                  The `release-tag-protection` ruleset (as in gaze)
#                  makes v* tags immutable once created: no deletion,
#                  no moves.
#   3. stage     — in the `npm` environment (required reviewers), checks
#                  out the tag, reruns the CI gates below, sets the
#                  package version from the tag (not committed; main
#                  holds 0.0.0-development), and runs
#                  `npm stage publish --provenance` through npm trusted
#                  publishing (OIDC; no tokens). Prereleases stage under
#                  the `next` dist-tag. The version goes public when a
#                  maintainer approves it on npmjs.com with 2FA.
#
# npm checks the calling workflow, so the trust relationship pins this
# file's name (release.yml) and the `npm` environment, not ship's
# workflow; neither can change without re-creating it.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag; the package version is taken from it (e.g., v0.3.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  release:
    name: Release
    uses: jflowers/ship/.github/workflows/npm-release.yml@bf09d24bd206ce8f9f1f44ea1479afa5ca11532d # v0.3.0
    with:
      tag: ${{ inputs.tag }}
      # Job names from ci.yml's node-version matrix.
      ci_checks: '["test (22)", "test (24)"]'
      version_from: tag
      stage: true
      environment: npm
      node_version: "24"
      install: npm ci
      checks: |
        npx biome check src/ tests/
        npm run build
        npx vitest run --coverage
    permissions:
      contents: write
      checks: read
      id-token: write
