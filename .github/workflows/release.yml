# Release
# =======
# One-click release, run by a maintainer from main with the version tag
# (e.g. v0.3.0), following unbound-force/unbound-force's release.yml:
#
#   1. verify    — the run is on main.
#   2. preflight — complytime/org-infra's shared preflight validates the
#                  tag (semver, unique, newer than the last tag), checks
#                  that ci.yml passed on HEAD and that there are
#                  unreleased commits, then creates the annotated tag.
#                  The `release-tag-protection` ruleset (as in gaze)
#                  makes v* tags immutable once created: no deletion,
#                  no moves.
#   3. stage     — in the `npm` environment (main only), checks out the
#                  tag, reruns the CI gates, sets the package version
#                  from the tag (not committed; main holds
#                  0.0.0-development), and runs `npm stage publish`
#                  through npm trusted publishing (OIDC; no tokens).
#                  Skipped if the version is already on npm, so re-runs
#                  are safe. The version goes public only when a
#                  maintainer approves it on npmjs.com with 2FA — the
#                  one human approval in a release.
#   4. github-release — creates the GitHub release for the tag with
#                  generated notes (skipped if it exists). If the staged
#                  version is later rejected, delete the release by hand;
#                  the tag stays.
#
# The npm trust relationship pins this file's name (release.yml) and
# the `npm` environment, so neither can change without re-creating it.

name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag; the package version is taken from it (e.g., v0.3.0)"
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require main
        env:
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" != "refs/heads/main" ]; then
            echo "::error::Run the release from main (this run is on $REF)"
            exit 1
          fi

  preflight:
    name: Preflight
    needs: verify
    uses: complytime/org-infra/.github/workflows/reusable_release_preflight.yml@8f347ba1aa2c7e9eb3b70e69c1709ddb456cd64a # v0.9.0
    with:
      tag: ${{ inputs.tag }}
      allow_prerelease: true
      # Job names from ci.yml's node-version matrix.
      ci_checks: '["test (22)", "test (24)"]'
    permissions:
      contents: write
      checks: read

  stage:
    name: Stage npm release
    needs: preflight
    if: needs.preflight.outputs.tag != ''
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ needs.preflight.outputs.tag }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: Install npm with staged publishing support
        run: npm install -g npm@11.21.2
      - name: Check whether the version is already on npm
        id: npm
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if npm view "reading-stone@${TAG#v}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "::notice::reading-stone@${TAG#v} is already on npm; skipping staging"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.npm.outputs.published == 'false'
        run: npm ci
      - if: steps.npm.outputs.published == 'false'
        run: npx biome check src/ tests/
      - if: steps.npm.outputs.published == 'false'
        run: npm run build
      - if: steps.npm.outputs.published == 'false'
        run: npx vitest run --coverage
      # After the gates, which test the tag as committed (package.json
      # holds the placeholder). VERSION is read from package.json at
      # load time, so nothing built needs to change.
      - name: Set the package version from the tag
        if: steps.npm.outputs.published == 'false'
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: npm version "${TAG#v}" --no-git-tag-version
      - name: Stage for maintainer approval
        if: steps.npm.outputs.published == 'false'
        env:
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          case "$TAG" in
            *-*) npm stage publish --provenance --tag next ;;
            *) npm stage publish --provenance ;;
          esac

  github-release:
    name: GitHub release
    needs: [preflight, stage]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.preflight.outputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists; leaving it unchanged"
            exit 0
          fi
          case "$TAG" in
            *-*) gh release create "$TAG" --verify-tag --generate-notes --prerelease ;;
            *) gh release create "$TAG" --verify-tag --generate-notes ;;
          esac
